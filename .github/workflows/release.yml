name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确认 jar 存在
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/biggerstacksextras-${VERSION}.jar"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/biggerstacksextras-${VERSION}.jar" \
            --title "Bigger Stacks Extras ${VERSION}" \
            --generate-notes
